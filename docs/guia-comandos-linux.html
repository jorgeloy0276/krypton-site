<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chuleta de comandos de Linux</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #eef2f5;
      --surface: #fff;
      --ink: #1b2430;
      --muted: #5a6676;
      --line: #d5dde5;
      --code-bg: #1b2430;
      --code: #f3f6f9;
      --accent: #e8a317;
      --teal: #0f766e;
      --chip: #dde6ee;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #10161d;
        --surface: #18212b;
        --ink: #e7edf3;
        --muted: #9aa7b5;
        --line: #2a3643;
        --code-bg: #0a0f14;
        --code: #e7edf3;
        --accent: #f0b73a;
        --teal: #4fd1c5;
        --chip: #243140
      }
    }

    :root[data-theme="dark"] {
      --bg: #10161d;
      --surface: #18212b;
      --ink: #e7edf3;
      --muted: #9aa7b5;
      --line: #2a3643;
      --code-bg: #0a0f14;
      --code: #e7edf3;
      --accent: #f0b73a;
      --teal: #4fd1c5;
      --chip: #243140
    }

    html {
      scroll-padding-top: 90px
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 "IBM Plex Sans", system-ui, sans-serif
    }

    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 16px
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.05;
      margin: 0 0 10px;
      letter-spacing: -.02em
    }

    h1 code {
      font-family: "JetBrains Mono", monospace;
      background: var(--code-bg);
      color: var(--accent);
      padding: 0 .25em;
      border-radius: 6px;
      font-size: .85em
    }

    header p {
      margin: 0;
      color: var(--muted);
      max-width: 60ch
    }

    .bar {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 5;
      background: var(--bg);
      padding: 10px 20px;
      border-bottom: 1px solid var(--line)
    }

    .bar-in {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    input {
      width: 100%;
      font: inherit;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink)
    }

    input:focus,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--teal);
      outline-offset: 2px
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px
    }

    .chips button {
      flex: none;
      font: 600 .85rem "IBM Plex Sans", sans-serif;
      border: 0;
      background: var(--chip);
      color: var(--ink);
      padding: 6px 12px;
      border-radius: 99px;
      cursor: pointer
    }

    .chips button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg)
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
      gap: 20px
    }

    section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      align-self: start
    }

    section h2 {
      margin: 0;
      padding: 14px 16px;
      font-size: 1.15rem;
      border-bottom: 3px solid var(--accent)
    }

    section h2 small {
      display: block;
      font-weight: 400;
      font-size: .85rem;
      color: var(--muted)
    }

    .row {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 8px 16px;
      border-top: 1px solid var(--line)
    }

    .row:first-of-type {
      border-top: 0
    }

    .cmd {
      font: 400 .85rem "JetBrains Mono", monospace;
      background: var(--code-bg);
      color: var(--code);
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      text-align: left;
      cursor: pointer;
      overflow-x: auto;
      white-space: nowrap;
      width: 100%
    }

    .cmd:hover {
      box-shadow: inset 0 0 0 1px var(--accent)
    }

    .cmd.ok {
      color: var(--accent)
    }

    .d {
      font-size: .9rem;
      color: var(--muted)
    }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      color: var(--muted);
      padding: 40px
    }

    footer {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 20px 40px;
      color: var(--muted);
      font-size: .85rem
    }

    @media (max-width:520px) {
      .row {
        grid-template-columns: 1fr;
        gap: 4px
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Guia de comandos  <code>Linux</code></h1>
    <p>Los comandos que más se usan, válidos en Ubuntu, Debian, Fedora, Arch y casi cualquier distribución. Toca un
      comando para copiarlo.</p>
  </header>
  <div class="bar">
    <div class="bar-in">
      <input id="q" type="search" placeholder="Busca un comando o una palabra: copiar, puerto, permisos…"
        aria-label="Buscar comandos">
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <main id="out"></main>
  <footer>Consejo: <code>man comando</code> o <code>comando --help</code> muestran todas las opciones. Con
    <code>sudo</code> delante se ejecuta como administrador; úsalo con cuidado.</footer>
  <script>
    var D = [
      ["Navegación", "Moverte por el sistema", [
        ["pwd", "Muestra en qué carpeta estás"],
        ["ls -lah", "Lista archivos con detalles, tamaños y ocultos"],
        ["cd /ruta", "Entra en una carpeta"],
        ["cd ~", "Va a tu carpeta personal"],
        ["cd ..", "Sube un nivel"],
        ["cd -", "Vuelve a la carpeta anterior"],
        ["tree -L 2", "Muestra el árbol de carpetas (2 niveles)"]]],
      ["Archivos y carpetas", "Crear, copiar, mover y borrar", [
        ["mkdir -p a/b/c", "Crea carpetas, incluidas las intermedias"],
        ["touch archivo.txt", "Crea un archivo vacío o actualiza su fecha"],
        ["cp -r origen destino", "Copia archivos o carpetas"],
        ["mv origen destino", "Mueve o renombra"],
        ["rm archivo", "Borra un archivo"],
        ["rm -rf carpeta", "Borra una carpeta entera sin preguntar (peligroso)"],
        ["ln -s destino enlace", "Crea un enlace simbólico"],
        ["file archivo", "Indica qué tipo de archivo es"]]],
      ["Ver contenido", "Leer y editar texto", [
        ["cat archivo", "Muestra todo el archivo"],
        ["less archivo", "Lee página a página (q para salir)"],
        ["head -n 20 archivo", "Primeras 20 líneas"],
        ["tail -n 20 archivo", "Últimas 20 líneas"],
        ["tail -f /var/log/syslog", "Sigue un log en tiempo real"],
        ["wc -l archivo", "Cuenta líneas"],
        ["nano archivo", "Editor sencillo en terminal"],
        ["vim archivo", "Editor avanzado (:wq guarda y sale)"]]],
      ["Buscar", "Encontrar archivos y texto", [
        ["find . -name \"*.txt\"", "Busca archivos por nombre"],
        ["find / -size +100M", "Busca archivos de más de 100 MB"],
        ["grep -rni \"texto\" .", "Busca texto dentro de archivos, recursivo"],
        ["grep -v \"x\" archivo", "Muestra líneas que no contienen x"],
        ["locate nombre", "Búsqueda rápida por índice"],
        ["which comando", "Dónde está el ejecutable de un comando"],
        ["sort | uniq -c", "Ordena y cuenta repetidos"],
        ["awk '{print $1}' archivo", "Imprime la primera columna"],
        ["sed -i 's/a/b/g' archivo", "Reemplaza a por b en el archivo"]]],
      ["Permisos y propietarios", "Quién puede hacer qué", [
        ["chmod 755 archivo", "Dueño todo; grupo y otros leer y ejecutar"],
        ["chmod +x script.sh", "Hace ejecutable un script"],
        ["chown usuario:grupo archivo", "Cambia dueño y grupo"],
        ["sudo comando", "Ejecuta como administrador"],
        ["su - usuario", "Cambia de usuario"],
        ["whoami", "Muestra tu usuario"],
        ["id", "Muestra tu UID y tus grupos"]]],
      ["Procesos", "Ver y controlar lo que se ejecuta", [
        ["ps aux", "Lista todos los procesos"],
        ["top", "Monitor de procesos en vivo"],
        ["htop", "Monitor mejorado (hay que instalarlo)"],
        ["kill PID", "Pide a un proceso que termine"],
        ["kill -9 PID", "Obliga a terminar un proceso"],
        ["pkill nombre", "Termina procesos por nombre"],
        ["comando &", "Ejecuta en segundo plano"],
        ["jobs", "Lista tareas en segundo plano"],
        ["nohup comando &", "Sigue ejecutándose al cerrar la terminal"]]],
      ["Sistema y disco", "Estado de la máquina", [
        ["df -h", "Espacio libre en discos"],
        ["du -sh carpeta", "Tamaño de una carpeta"],
        ["free -h", "Memoria RAM en uso"],
        ["uname -a", "Versión del kernel y del sistema"],
        ["cat /etc/os-release", "Qué distribución es"],
        ["uptime", "Tiempo encendido y carga"],
        ["lsblk", "Lista discos y particiones"],
        ["mount | column -t", "Sistemas de archivos montados"],
        ["journalctl -xe", "Últimos errores del sistema"],
        ["systemctl status nombre", "Estado de un servicio"],
        ["sudo systemctl restart nombre", "Reinicia un servicio"],
        ["sudo reboot", "Reinicia el equipo"],
        ["sudo shutdown now", "Apaga el equipo"]]],
      ["Red", "Conexiones y descargas", [
        ["ip a", "Muestra tus direcciones IP"],
        ["ping -c 4 google.com", "Comprueba la conexión"],
        ["ss -tulpn", "Puertos abiertos y quién los usa"],
        ["curl -O URL", "Descarga un archivo"],
        ["curl -I URL", "Muestra solo las cabeceras HTTP"],
        ["wget URL", "Descarga un archivo"],
        ["ssh usuario@servidor", "Conecta a otra máquina"],
        ["scp archivo usuario@host:/ruta", "Copia por SSH a otra máquina"],
        ["rsync -avz origen/ destino/", "Sincroniza carpetas de forma eficiente"],
        ["dig dominio", "Consulta DNS"],
        ["traceroute dominio", "Ruta que siguen los paquetes"]]],
      ["Paquetes", "Instalar y actualizar software", [
        ["sudo apt update && sudo apt upgrade", "Debian, Ubuntu, Mint: actualiza todo"],
        ["sudo apt install paquete", "Debian, Ubuntu: instala"],
        ["sudo apt remove paquete", "Debian, Ubuntu: desinstala"],
        ["sudo dnf install paquete", "Fedora, RHEL, Rocky: instala"],
        ["sudo dnf upgrade", "Fedora, RHEL: actualiza todo"],
        ["sudo pacman -Syu", "Arch, Manjaro: actualiza todo"],
        ["sudo pacman -S paquete", "Arch, Manjaro: instala"],
        ["sudo zypper install paquete", "openSUSE: instala"]]],
      ["Compresión", "Empaquetar y desempaquetar", [
        ["tar -czvf salida.tar.gz carpeta/", "Crea un .tar.gz"],
        ["tar -xzvf archivo.tar.gz", "Extrae un .tar.gz"],
        ["tar -xvf archivo.tar", "Extrae un .tar"],
        ["zip -r salida.zip carpeta/", "Crea un .zip"],
        ["unzip archivo.zip", "Extrae un .zip"],
        ["gzip archivo", "Comprime con gzip"],
        ["gunzip archivo.gz", "Descomprime un .gz"]]],
      ["Usuarios", "Administrar cuentas", [
        ["sudo adduser nombre", "Crea un usuario"],
        ["sudo passwd nombre", "Cambia la contraseña"],
        ["sudo usermod -aG grupo nombre", "Añade un usuario a un grupo"],
        ["sudo userdel -r nombre", "Borra un usuario y su carpeta"],
        ["last", "Últimos accesos al sistema"],
        ["who", "Quién está conectado ahora"]]],
      ["Pipes y redirecciones", "Encadenar comandos", [
        ["comando > archivo", "Guarda la salida (sobrescribe)"],
        ["comando >> archivo", "Añade la salida al final"],
        ["comando 2> errores.txt", "Guarda solo los errores"],
        ["comando1 | comando2", "Pasa la salida de uno al siguiente"],
        ["comando1 && comando2", "Ejecuta el segundo si el primero funciona"],
        ["comando | tee archivo", "Muestra y guarda la salida a la vez"],
        ["history | grep texto", "Busca en tu historial de comandos"],
        ["alias ll='ls -lah'", "Crea un atajo para un comando"]]],
      ["Atajos de terminal", "Ahorra pulsaciones", [
        ["Ctrl + C", "Cancela el comando actual"],
        ["Ctrl + R", "Busca en el historial"],
        ["Ctrl + L", "Limpia la pantalla (o escribe clear)"],
        ["Ctrl + A / Ctrl + E", "Inicio / final de la línea"],
        ["Ctrl + W", "Borra la palabra anterior"],
        ["Tab", "Autocompleta nombres"],
        ["!!", "Repite el último comando"],
        ["sudo !!", "Repite el último con sudo"]]]
    ];
    var out = document.getElementById('out'), q = document.getElementById('q'), chips = document.getElementById('chips'), cat = '';
    function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') }
    function draw() {
      var t = q.value.trim().toLowerCase(), h = '';
      D.forEach(function (s) {
        if (cat && cat !== s[0]) return;
        var rows = s[2].filter(function (r) { return !t || (r[0] + ' ' + r[1] + ' ' + s[0]).toLowerCase().indexOf(t) > -1 });
        if (!rows.length) return;
        h += '<section><h2>' + s[0] + '<small>' + s[1] + '</small></h2>' + rows.map(function (r) {
          return '<div class="row"><button class="cmd" data-c="' + esc(r[0]) + '" title="Copiar">' + esc(r[0]) + '</button><span class="d">' + esc(r[1]) + '</span></div>'
        }).join('') + '</section>';
      });
      out.innerHTML = h || '<p class="empty">No hay comandos con esa búsqueda. Prueba con otra palabra o quita el filtro.</p>';
    }
    function chipsDraw() {
      chips.innerHTML = ['Todo'].concat(D.map(function (s) { return s[0] })).map(function (n) {
        var on = (n === 'Todo' && !cat) || n === cat; return '<button aria-pressed="' + on + '" data-n="' + esc(n) + '">' + n + '</button>'
      }).join('');
    }
    chips.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; cat = b.dataset.n === 'Todo' ? '' : b.dataset.n; chipsDraw(); draw() });
    q.addEventListener('input', draw);
    out.addEventListener('click', function (e) {
      var b = e.target.closest('.cmd'); if (!b) return;
      var c = b.dataset.c, old = b.textContent;
      function done() { b.classList.add('ok'); b.textContent = 'Copiado'; setTimeout(function () { b.classList.remove('ok'); b.textContent = old }, 900) }
      try { navigator.clipboard.writeText(c).then(done, function () { }) } catch (x) { }
    });
    chipsDraw(); draw();
  </script>
</body>

</html>
